<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TownForge Review</title>
<style>
  :root {
    --bg: #0d0f12; --panel: #15181d; --panel2: #1b1f26; --line: #272c35; --text: #e7e9ee;
    --muted: #8b93a1; --faint: #5b6270; --accent: #7fd0ff;
    --ok: #3ecf8e; --ok-bg: rgba(62, 207, 142, .12);
    --warn: #ffb547; --warn-bg: rgba(255, 181, 71, .12);
    --stale: #b48cff; --stale-bg: rgba(180, 140, 255, .14);
    --claude: #e8a07c; --auto: #7fa6c8;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: auto 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 12px 20px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  header .brand { font-weight: 700; letter-spacing: .08em; font-size: 12px; color: var(--muted); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  .ready { padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); color: var(--muted); }
  .ready.yes { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
  nav { border-right: 1px solid var(--line); padding: 16px 12px; overflow-y: auto; background: var(--panel); }
  .gate { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; padding: 10px 10px;
    border-radius: var(--radius); border: 1px solid transparent; background: none; margin-bottom: 4px; }
  .gate:hover { background: var(--panel2); }
  .gate.active { background: var(--panel2); border-color: var(--line); }
  .gate .num { flex: 0 0 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; font-weight: 700; border: 1px solid var(--line); color: var(--muted); }
  .gate.done .num { background: var(--ok); color: #062; border-color: var(--ok); }
  .gate.locked { opacity: .55; }
  .gate .t { font-weight: 600; }
  .gate .s { font-size: 12px; color: var(--muted); }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .help { margin-top: 18px; padding: 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
  .help kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; color: var(--text); }
  main { overflow-y: auto; padding: 22px 26px 60px; }
  .gatehead { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 18px; }
  .gatehead h2 { margin: 0 0 4px; font-size: 20px; }
  .gatehead p { margin: 0; color: var(--muted); max-width: 70ch; }
  .lockmsg { margin: 0 0 18px; padding: 10px 14px; border-radius: var(--radius); background: var(--panel2);
    border: 1px dashed var(--line); color: var(--muted); }
  .btn { border: 1px solid var(--line); background: var(--panel2); padding: 8px 14px; border-radius: 8px; font-weight: 600; }
  .btn:hover { border-color: var(--muted); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #04210f; }
  .btn.warn { background: transparent; border-color: var(--warn); color: var(--warn); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
    text-align: left; padding: 0; display: flex; flex-direction: column; transition: transform .08s, border-color .08s; }
  .card:hover { border-color: var(--muted); transform: translateY(-1px); }
  .thumb { aspect-ratio: 9 / 13; background: #000 center / cover no-repeat; position: relative; }
  .thumb.text { background: var(--panel2); padding: 14px; font-size: 12px; color: var(--muted); overflow: hidden;
    white-space: pre-wrap; aspect-ratio: auto; height: 180px; }
  .thumb .kind { position: absolute; left: 8px; top: 8px; font-size: 11px; background: rgba(0,0,0,.6); padding: 2px 7px; border-radius: 999px; }
  .card .body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .card .title { font-weight: 600; font-size: 13px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .chip.approved { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
  .chip.changes { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
  .chip.stale { color: var(--stale); border-color: var(--stale); background: var(--stale-bg); }
  .chip.sugg { color: var(--claude); border-color: rgba(232,160,124,.4); }
  /* detail */
  .detail { position: fixed; inset: 0; background: rgba(5,6,8,.92); display: none; z-index: 10; }
  .detail.open { display: grid; grid-template-columns: minmax(0, 1fr) 420px; grid-template-rows: minmax(0, 1fr); }
  .viewer { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px; gap: 12px; min-width: 0; min-height: 0; height: 100%; }
  .stage { flex: 1 1 0; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  .stage img, .stage video { object-fit: contain; height: 100%; width: auto; }
  .stage img, .stage video { max-height: 100%; max-width: 100%; border-radius: 8px; background: #000; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .stage audio { width: min(560px, 100%); }
  .stage .textblock { max-width: 720px; max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px 24px; white-space: pre-wrap; font: 14px/1.6 ui-monospace, Consolas, monospace; }
  .caption { color: var(--muted); font-size: 12px; min-height: 1em; }
  .strip { display: flex; gap: 8px; overflow-x: auto; max-width: 100%; padding-bottom: 4px; }
  .strip button { flex: 0 0 auto; width: 64px; height: 92px; border-radius: 6px; border: 2px solid transparent; background: #000 center / cover;
    position: relative; padding: 0; }
  .strip button.sel { border-color: var(--accent); }
  .strip button span { position: absolute; inset: auto 0 0 0; font-size: 9px; background: rgba(0,0,0,.65); padding: 1px 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; height: 100%; }
  .side .top { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  .side .top h3 { margin: 0; font-size: 15px; flex: 1; }
  .side .scroll { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 18px; }
  .section h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 12px; }
  dt { color: var(--muted); }
  dd { margin: 0; word-break: break-word; white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
  .sugg { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); cursor: pointer; }
  .sugg + .sugg { margin-top: 8px; }
  .sugg input { margin-top: 3px; accent-color: var(--claude); }
  .sugg .who { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .sugg .who.claude { color: var(--claude); } .sugg .who.auto { color: var(--auto); }
  .none { color: var(--faint); font-size: 12px; }
  textarea { width: 100%; min-height: 90px; resize: vertical; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; font: inherit; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .actions { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  .actions .btn { flex: 1; padding: 10px; }
  .saved { font-size: 11px; color: var(--faint); min-width: 50px; text-align: right; }
  .iconbtn { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 2px 11px; color: var(--text); font-size: 18px; line-height: 1.2; }
  .warnline { font-size: 12px; color: var(--stale); }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; z-index: 20; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
    nav { border-right: none; border-bottom: 1px solid var(--line); display: flex; gap: 6px; overflow-x: auto; padding: 8px; }
    .gate { min-width: 160px; margin: 0; } .help { display: none; }
    main { padding: 16px; }
    .detail.open { grid-template-columns: 1fr; grid-template-rows: 55vh minmax(0, 1fr); }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="brand">TOWNFORGE · REVIEW</span>
    <h1 id="title">Loading…</h1>
    <span class="spacer"></span>
    <span class="ready" id="ready">Final render: locked</span>
  </header>
  <nav id="gates"></nav>
  <main id="main"></main>
</div>

<div class="detail" id="detail">
  <div class="viewer">
    <div class="stage" id="stage"></div>
    <div class="caption" id="caption"></div>
    <div class="strip" id="strip"></div>
  </div>
  <aside class="side">
    <div class="top">
      <h3 id="d-title"></h3>
      <button class="iconbtn" id="prev" title="Previous (←)">‹</button>
      <button class="iconbtn" id="next" title="Next (→)">›</button>
      <button class="iconbtn" id="close" title="Close (Esc)">✕</button>
    </div>
    <div class="scroll">
      <div id="d-status"></div>
      <div class="section"><h4>Suggested improvements</h4><div id="d-sugg"></div></div>
      <div class="section"><h4>Your note</h4>
        <textarea id="d-note" placeholder="What should change? (saved automatically)"></textarea></div>
      <div class="section"><h4>Details</h4><dl id="d-details"></dl></div>
    </div>
    <div class="actions">
      <button class="btn warn" id="b-changes">Request changes <small>(R)</small></button>
      <button class="btn ok" id="b-approve">Approve <small>(A)</small></button>
      <span class="saved" id="saved"></span>
    </div>
  </aside>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let board = null, gateId = null, openItem = null, mediaIdx = 0, noteTimer = null;

async function load() {
  const r = await fetch("/api/board");
  board = await r.json();
  if (!gateId || !board.gates.find((g) => g.id === gateId)) {
    gateId = (board.gates.find((g) => g.open && !g.complete) || board.gates[0] || {}).id;
  }
  render();
  if (openItem) {
    const it = findItem(openItem);
    if (it) renderDetail(it, false);
  }
}

function findItem(id) {
  for (const g of board.gates) for (const it of g.items) if (it.id === id) return it;
  return null;
}
function gateOf(id) { return board.gates.find((g) => g.items.some((it) => it.id === id)); }

function statusChip(d) {
  if (d.stale) return '<span class="chip stale">changed since approval</span>';
  if (d.status === "approved") return '<span class="chip approved">approved</span>';
  if (d.status === "changes") return '<span class="chip changes">changes requested</span>';
  return '<span class="chip">to review</span>';
}

function render() {
  $("title").textContent = board.title || board.episode;
  const ready = $("ready");
  ready.textContent = board.all_approved ? "Final render: ready" : "Final render: locked";
  ready.classList.toggle("yes", board.all_approved);
  $("gates").innerHTML = board.gates.map((g, i) => `
    <button class="gate ${g.id === gateId ? "active" : ""} ${g.complete ? "done" : ""} ${g.open ? "" : "locked"}" data-gate="${g.id}">
      <span class="num">${g.complete ? "✓" : i + 1}</span>
      <span style="flex:1"><div class="t">${esc(g.title)} ${g.open ? "" : "🔒"}</div>
        <div class="s">${g.approved}/${g.items.length} approved</div>
        <div class="bar"><i style="width:${g.items.length ? (100 * g.approved / g.items.length) : 0}%"></i></div></span>
    </button>`).join("") + `<div class="help">
      Approve every item, gate by gate. Tick Claude's suggestions you want applied and add notes.
      When you're done, tell Claude <b>“review done”</b>; it reads your notes and prepares the next round.<br><br>
      <kbd>A</kbd> approve · <kbd>R</kbd> request changes · <kbd>←</kbd><kbd>→</kbd> items · <kbd>Esc</kbd> close</div>`;
  document.querySelectorAll(".gate").forEach((b) => b.onclick = () => { gateId = b.dataset.gate; render(); });
  const g = board.gates.find((x) => x.id === gateId);
  if (!g) { $("main").innerHTML = '<p class="none">Nothing to review yet.</p>'; return; }
  const idx = board.gates.indexOf(g);
  const pending = g.items.filter((it) => it.decision.status === "pending").length;
  $("main").innerHTML = `
    <div class="gatehead"><div style="flex:1"><h2>${esc(g.title)}</h2><p>${esc(g.description)}</p></div>
      <button class="btn ok" id="approve-all" ${g.open && pending ? "" : "disabled"}>Approve ${pending} remaining</button></div>
    ${g.open ? "" : `<div class="lockmsg">🔒 Locked until <b>${esc(board.gates.slice(0, idx).filter((x) => !x.complete).map((x) => x.title).join(", "))}</b> ${idx > 1 ? "are" : "is"} fully approved. You can look, but not decide yet.</div>`}
    <div class="grid">${g.items.map(card).join("")}</div>`;
  document.querySelectorAll(".card").forEach((c) => c.onclick = () => openDetail(c.dataset.item));
  const aa = $("approve-all");
  if (aa) aa.onclick = async () => {
    if (!confirmInline(aa, `Approve all ${pending}?`)) return;
    await post("/api/approve_gate", { gate: g.id }); toast("Gate approved"); load();
  };
}

function confirmInline(btn, text) {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = "1"; const old = btn.textContent; btn.textContent = text + " Click again";
  setTimeout(() => { delete btn.dataset.armed; btn.textContent = old; }, 2500);
  return false;
}

function thumbOf(it) {
  const img = it.media.find((m) => m.type === "image");
  if (img) return `<div class="thumb" style="background-image:url('/media/${encodeURI(img.src)}')">${it.media.some((m) => m.type === "video") ? '<span class="kind">▶ clip</span>' : ""}</div>`;
  const txt = it.media.find((m) => m.type === "text");
  const aud = it.media.some((m) => m.type === "audio");
  return `<div class="thumb text">${aud ? "🔊 " : ""}${esc((txt && txt.text || "").slice(0, 400))}</div>`;
}

function card(it) {
  const n = it.suggestions.length;
  return `<button class="card" data-item="${esc(it.id)}">${thumbOf(it)}
    <div class="body"><div class="title">${esc(it.title)}</div>
      <div class="chips">${statusChip(it.decision)}${n ? `<span class="chip sugg">${n} suggestion${n > 1 ? "s" : ""}</span>` : ""}
      ${it.decision.note ? '<span class="chip">note</span>' : ""}</div></div></button>`;
}

function openDetail(id) {
  openItem = id; mediaIdx = 0;
  const it = findItem(id);
  // Video first when there is one; otherwise the first item.
  const v = it.media.findIndex((m) => m.type === "video" || m.type === "audio");
  mediaIdx = v >= 0 ? v : 0;
  $("detail").classList.add("open");
  renderDetail(it, true);
}

function closeDetail() {
  flushNote();
  openItem = null;
  $("detail").classList.remove("open");
  $("stage").innerHTML = "";
  render();
}

function renderMedia(it) {
  const m = it.media[mediaIdx];
  const src = m.src ? "/media/" + encodeURI(m.src) : "";
  let html = "";
  if (m.type === "image") html = `<img src="${src}" alt="">`;
  else if (m.type === "video") html = `<video src="${src}" controls autoplay playsinline></video>`;
  else if (m.type === "audio") html = `<audio src="${src}" controls autoplay></audio>`;
  else html = `<div class="textblock">${esc(m.text)}</div>`;
  $("stage").innerHTML = html;
  $("caption").textContent = m.caption || "";
  const visual = it.media.length > 1;
  $("strip").innerHTML = visual ? it.media.map((x, i) => {
    const bg = x.type === "image" ? `background-image:url('/media/${encodeURI(x.src)}')` : "";
    const label = x.type === "video" ? "▶ clip" : x.type === "audio" ? "🔊 audio" : x.type === "text" ? "¶ text" : (x.caption || "");
    return `<button class="${i === mediaIdx ? "sel" : ""}" style="${bg}" data-i="${i}"><span>${esc(label)}</span></button>`;
  }).join("") : "";
  document.querySelectorAll("#strip button").forEach((b) => b.onclick = () => { mediaIdx = +b.dataset.i; renderMedia(it); });
}

function renderDetail(it, withMedia) {
  const g = gateOf(it.id);
  $("d-title").textContent = it.title;
  if (withMedia) renderMedia(it);
  const d = it.decision;
  $("d-status").innerHTML = statusChip(d) + (d.stale ? '<div class="warnline" style="margin-top:6px">This changed after you approved it. Have another look.</div>' : "")
    + (g.open ? "" : '<div class="lockmsg" style="margin:10px 0 0">🔒 Approve the earlier gates first.</div>');
  $("d-sugg").innerHTML = it.suggestions.length ? it.suggestions.map((s) => `
    <label class="sugg"><input type="checkbox" data-s="${esc(s.id)}" ${d.accepted.includes(s.id) ? "checked" : ""} ${g.open ? "" : "disabled"}>
      <span><div class="who ${s.source === "claude" ? "claude" : "auto"}">${s.source === "claude" ? "Claude" : "Automatic check"}</div>${esc(s.text)}
      ${s.source === "claude" ? "" : ""}</span></label>`).join("") : '<div class="none">No suggestions for this item.</div>';
  document.querySelectorAll("#d-sugg input").forEach((cb) => cb.onchange = () => save(null));
  const ta = $("d-note");
  if (document.activeElement !== ta) ta.value = d.note || "";
  ta.disabled = !g.open;
  $("d-details").innerHTML = Object.entries(it.details || {}).map(([k, v]) =>
    `<dt>${esc(k)}</dt><dd>${esc(typeof v === "object" ? JSON.stringify(v, null, 1) : v)}</dd>`).join("");
  $("b-approve").disabled = !g.open;
  $("b-changes").disabled = !g.open;
}

function accepted() { return [...document.querySelectorAll("#d-sugg input:checked")].map((x) => x.dataset.s); }

async function save(status) {
  const it = findItem(openItem);
  if (!it || !gateOf(it.id).open) return;
  const st = status || (it.decision.status === "pending" && accepted().length ? "changes" : it.decision.status);
  $("saved").textContent = "saving…";
  const r = await post("/api/decision", { item: it.id, status: st, note: $("d-note").value, accepted: accepted(), fingerprint: it.fingerprint });
  $("saved").textContent = r.ok ? "saved" : "error";
  await load();
  return r.ok;
}

function flushNote() { if (noteTimer) { clearTimeout(noteTimer); noteTimer = null; save(null); } }

async function decideAndNext(status) {
  if (status === "changes" && !$("d-note").value.trim() && !accepted().length) {
    $("d-note").focus(); toast("Say what should change, or tick a suggestion"); return;
  }
  clearTimeout(noteTimer); noteTimer = null;
  if (await save(status)) { toast(status === "approved" ? "Approved" : "Changes requested"); step(1); }
}

function step(dir) {
  const g = gateOf(openItem); const i = g.items.findIndex((x) => x.id === openItem);
  const j = i + dir;
  if (j < 0 || j >= g.items.length) { closeDetail(); return; }
  flushNote(); openDetail(g.items[j].id);
}

async function post(url, body) {
  try {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    return await r.json();
  } catch (e) { toast("Could not reach the review server. Is `tf review serve` still running?"); return { ok: false }; }
}

function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 1800); }

$("d-note").addEventListener("input", () => { clearTimeout(noteTimer); $("saved").textContent = "…"; noteTimer = setTimeout(() => { noteTimer = null; save(null); }, 700); });
$("b-approve").onclick = () => decideAndNext("approved");
$("b-changes").onclick = () => decideAndNext("changes");
$("close").onclick = closeDetail;
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
document.addEventListener("keydown", (e) => {
  if (!openItem) return;
  if (e.target.tagName === "TEXTAREA") { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "Escape") closeDetail();
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "a" || e.key === "A") decideAndNext("approved");
  else if (e.key === "r" || e.key === "R") { e.preventDefault(); $("d-note").focus(); }
});
load();
</script>
</body>
</html>
