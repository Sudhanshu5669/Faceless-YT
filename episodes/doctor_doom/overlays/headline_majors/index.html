<!doctype html>
<!-- The real headline (Euronews, AP copy, 19 Dec 2023), as a news card over board_news. HyperFrames composition:
     render with  npx hyperframes render . --fps 60 --format mov  (transparent ProRes 4444), composite over the shot. -->
<html lang="en" data-resolution="landscape">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; }
  #root { width:100%; height:100%; position:relative; font-family: Georgia, 'Times New Roman', serif; }
  #card { position:absolute; left:120px; top:250px; width:820px; background:#f7f5f0; color:#111;
          border-radius:6px; box-shadow:0 30px 80px rgba(0,0,0,.55), 0 4px 14px rgba(0,0,0,.4); overflow:hidden; }
  #bar { height:10px; background:#0b2a5b; }
  #inner { padding:34px 44px 40px; }
  #src { font-family:'Segoe UI', Arial, sans-serif; font-size:24px; font-weight:700; letter-spacing:.02em; color:#0b2a5b; }
  #date { font-family:'Segoe UI', Arial, sans-serif; font-size:22px; color:#555; margin-left:14px; font-weight:400; }
  #hl { font-size:58px; line-height:1.12; font-weight:700; margin-top:22px; letter-spacing:-.01em; }
  .mark { background:linear-gradient(transparent 60%, rgba(255,214,0,.85) 60%); background-size:0% 100%;
          background-repeat:no-repeat; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6.4" data-width="1920" data-height="1080">
  <div id="card" class="clip" data-start="0" data-duration="6.4">
    <div id="bar"></div>
    <div id="inner">
      <div><span id="src">euronews.</span><span id="date">19/12/2023</span></div>
      <div id="hl">Jonathan Majors <span class="mark" id="m1">found guilty of assault</span> and dropped by Marvel</div>
    </div>
  </div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#card", {x:-140, opacity:0, rotation:-2}, {x:0, opacity:1, rotation:0, duration:0.7, ease:"power3.out"}, 0.9);
  tl.to("#m1", {backgroundSize:"100% 100%", duration:0.6, ease:"power2.inOut"}, 3.2);
  tl.to("#card", {x:-60, opacity:0, duration:0.45, ease:"power2.in"}, 5.85);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
